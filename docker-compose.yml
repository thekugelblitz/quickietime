services:
  quickietime:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_URL: ${SITE_URL:-https://qtai.click}
        SITE_OPERATOR: ${SITE_OPERATOR:-HostingSpell LLP}
        CONTACT_EMAIL: ${CONTACT_EMAIL:-support@qtai.click}
        AI_PROVIDER: ${AI_PROVIDER:-openai}
        SITE_INDEXABLE: ${SITE_INDEXABLE:-true}
    environment:
      SITE_URL: ${SITE_URL:-https://qtai.click}
      SITE_OPERATOR: ${SITE_OPERATOR:-HostingSpell LLP}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-support@qtai.click}
      SITE_INDEXABLE: ${SITE_INDEXABLE:-true}
      AUTH_SECRET: ${AUTH_SECRET:?Set a long random secret}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?Set a persistent 64-character hex key}
      ADMIN_SETUP_TOKEN: ${ADMIN_SETUP_TOKEN:-}
      TRUST_PROXY: "true"
      DATABASE_PATH: /app/data/quickietime.sqlite
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      CHEAPERINFERENCE_API_KEY: ${CHEAPERINFERENCE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      REPLICATE_API_TOKEN: ${REPLICATE_API_TOKEN:-}
      SMTP_HOST: ${SMTP_HOST:-ncr1.int3rnet.net}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-support@qtai.click}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-$$~=YL1mwK%VFHqNk}
      SMTP_FROM: ${SMTP_FROM:-QuickieTime <support@qtai.click>}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    expose:
      - "3000"
    volumes:
      - quickietime_data:/app/data
      - quickietime_backups:/app/backups
    networks:
      - dokploy-network
      - default
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.quickietime-websecure.rule=Host(`qtai.click`) || Host(`www.qtai.click`)"
      - "traefik.http.routers.quickietime-websecure.entrypoints=websecure"
      - "traefik.http.routers.quickietime-websecure.tls=true"
      - "traefik.http.routers.quickietime-websecure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.quickietime-websecure.service=quickietime"
      - "traefik.http.routers.quickietime-web.rule=Host(`qtai.click`) || Host(`www.qtai.click`)"
      - "traefik.http.routers.quickietime-web.entrypoints=web"
      - "traefik.http.routers.quickietime-web.service=quickietime"
      - "traefik.http.services.quickietime.loadbalancer.server.port=3000"

volumes:
  quickietime_data:
  quickietime_backups:

networks:
  dokploy-network:
    external: true
  default:
